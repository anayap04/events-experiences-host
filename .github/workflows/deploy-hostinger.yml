name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /events-experiences
      NEXT_PUBLIC_SITE_URL: https://anayap.tech/events-experiences/
      HOSTINGER_SERVER_DIR: ./domains/anayap.tech/public_html/events-experiences/
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Install TypeScript
        run: npm install -g typescript@5.4.5 --ignore-scripts

      - name: Type check
        run: npm run type-check

      - name: Run WCAG 2.2 AA & Unit Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found!"
            exit 1
          fi
          echo "Build output contents:"
          ls -la dist/

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@8a24039354ee91000cb948cb4a1dbdf1a1b94a3c # v4.3.4
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: 21
          local-dir: ./dist/
          server-dir: ${{ env.HOSTINGER_SERVER_DIR }}
          dangerous-clean-slate: false

      - name: Deployment Success
        run: echo "✓ Deployment to https://anayap.tech/events-experiences completed successfully!"
